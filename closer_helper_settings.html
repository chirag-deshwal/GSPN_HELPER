<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Closer Helper Settings</title>
  <link rel="icon" type="image/png" href="icons/icon48.png">
  <link rel="stylesheet" href="closer_helper_settings.css">
</head>
<body>
  <div class="settings-container">
    <!-- Header -->
    <header class="settings-header">
      <div class="header-left">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="7" height="7" rx="1.5" fill="#60a5fa"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5" fill="#34d399"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5" fill="#a78bfa"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5" fill="#fbbf24"/>
        </svg>
        <div>
          <h1>Closer Helper Settings</h1>
          <p class="subtitle">Configure autofill presets for GSPN Service Orders</p>
        </div>
      </div>
      <div class="header-right" style="display: flex; gap: 8px; align-items: center;">
        <input type="file" id="fileImportPreset" accept=".json,application/json" style="display: none;" />
        <button id="btnImportPreset" class="btn btn-secondary" title="Import Preset from JSON file">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Import Preset
        </button>
        <button id="btnAddPreset" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New Preset
        </button>
      </div>
    </header>

    <!-- Preset Tabs -->
    <div class="preset-tabs-wrap">
      <div id="presetTabs" class="preset-tabs">
        <!-- Tabs inject here -->
      </div>
    </div>

    <!-- Preset Editor -->
    <div id="presetEditor" class="preset-editor hidden">

      <!-- Preset Name + Category + Work Type -->
      <div class="editor-section editor-name-section">
        <div class="field-row">
          <label for="presetName">Preset Name</label>
          <input type="text" id="presetName" placeholder="e.g. AC Install, WM Repair…" />
        </div>
        <div class="field-row">
          <label for="presetTeam">Team</label>
          <select id="presetTeam">
            <option value="">— Select Team —</option>
            <option value="Installation-AC">Installation-AC</option>
            <option value="Installation-HA">Installation-HA</option>
            <option value="InHome">InHome</option>
            <option value="AC">AC</option>
          </select>
        </div>
        <div class="dropdown-grid">
          <div class="field-row">
          <label for="presetProduct">Category</label>
          <select id="presetProduct">
            <option value="">— Select Category —</option>
          </select>
        </div>
        <div class="field-row">
          <label for="presetWorkType">Work Type</label>
          <select id="presetWorkType">
            <option value="">— Select Work Type —</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Dynamic Fields (populated by JS based on product + work type) -->
    <div class="editor-section" id="dynamicFieldsSection">
      <div id="dynamicFields">
        <p class="section-hint">Select a Category and Work Type above to see fields.</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="editor-actions" style="margin-top: 20px;">
        <button id="btnDelete" class="btn btn-danger">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14H7L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          Delete Preset
        </button>
        <div style="display: flex; gap: 8px;">
          <button id="btnCopyPreset" class="btn btn-secondary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            Copy Preset
          </button>
          <button id="btnSave" class="btn btn-success">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save Preset
          </button>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1" stroke-linecap="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/>
        <line x1="9" y1="15" x2="15" y2="15"/>
      </svg>
      <h2>No Presets Yet</h2>
      <p>Click <strong>"New Preset"</strong> above to create your first autofill configuration.</p>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden">
      <span id="toastText"></span>
    </div>
  </div>

  <script src="closer_helper_settings.js"></script>
</body>
</html>
